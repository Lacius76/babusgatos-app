      servings: SIZES[DEFAULT_SIZE_IDX].servings,
      flavor: FLAVORS[DEFAULT_FLAVOR_IDX].id,
      flavorModifier: 0,
      cream: CREAMS[DEFAULT_CREAM_IDX].id,
      creamModifier: CREAMS[DEFAULT_CREAM_IDX].modifier,
      decoration: [],
      decorationModifier: 0,
      candleCount: 10,
      candleMode: "digits",
      message: "",
      price: SIZES[DEFAULT_SIZE_IDX].price,
    };

    let currentStep = 1;
    let sizeSelectedIdx = DEFAULT_SIZE_IDX;
    let sizePreviewIdx = DEFAULT_SIZE_IDX;
    let flavorSelectedIdx = DEFAULT_FLAVOR_IDX;
    let flavorPreviewIdx = DEFAULT_FLAVOR_IDX;
    let creamSelectedIdx = DEFAULT_CREAM_IDX;
    let creamPreviewIdx = DEFAULT_CREAM_IDX;
    let decorationSelected = new Set();
    let decorationHoverIdx = null;
    let summaryDecoExpanded = false;

    const I18n = window.BabusgatosI18n;
    const Cart = window.BabusgatosCart;

    /* ── SVG cake builder ────────────────────────────── */
    function buildChocolateDrips(cx, topY, rx, ry, layer) {
      const drips = [];
      const count = 14;
      const src = "assets/configurator/decoration/chocolate.png";
      const size = layer === "front" ? 28 : 22;
      for (let i = 0; i < count; i++) {
        const angle = (2 * Math.PI * i) / count - Math.PI / 2;
        const isFront = Math.sin(angle) > 0.05;
        if (layer === "back" && isFront) continue;
        if (layer === "front" && !isFront) continue;
        const cosA = Math.cos(angle);
        let x = cx + (rx - 6) * cosA;
        const y = topY + (ry - 2) * Math.sin(angle);
        // Nudge leftmost/rightmost drips slightly inward
        if (Math.abs(cosA) > 0.9) x += cosA > 0 ? -2 : 2;
        const imgX = x - size / 2;
        // Hang slightly over the rim; shift all drips up 15px; back layer +8px down
        let imgY = y - size * 0.35 - 15;
        if (layer === "back") imgY += 8;
        drips.push(
          `<image href="${src}" x="${imgX.toFixed(1)}" y="${imgY.toFixed(1)}" width="${size}" height="${size}" preserveAspectRatio="xMidYMid meet"/>`
        );
      }
      return drips.join("\n        ");
    }

    function buildCandlesSvg(cx, topY, rx, ry, count, mode) {
      const n = Math.max(1, Math.min(99, count | 0));
      const parts = [];
      if (mode === "digits") {
        const digits = String(n).split("");
        const w = digits.length > 2 ? 56 : 72;
        const h = w * 1.55;
        // Pull digits together: left +18px / right -18px vs default spacing
        const gap = digits.length > 2 ? -20 : -30;
        const totalW = digits.length * w + (digits.length - 1) * gap;
        let x = cx - totalW / 2;
        digits.forEach((d) => {
          parts.push(
            `<image href="assets/configurator/decoration/candle-${d}.png" x="${x.toFixed(1)}" y="${(topY - h - 4).toFixed(1)}" width="${w}" height="${h}" preserveAspectRatio="xMidYMax meet"/>`
          );
          x += w + gap;
        });
        return parts.join("\n        ");
      }

      const shown = Math.min(n, 24);
      const candleW = shown > 18 ? 28 : shown > 12 ? 36 : 44;
      const candleH = candleW * 1.7;
      const ringRx = rx * 0.55;
      const ringRy = ry * 0.55;
      for (let i = 0; i < shown; i++) {
        const angle = (2 * Math.PI * i) / shown - Math.PI / 2;
        const x = cx + ringRx * Math.cos(angle) - candleW / 2;
        const y = topY + ringRy * Math.sin(angle) - candleH + 10;
        parts.push(
          `<image href="assets/configurator/decoration/candle.png" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${candleW}" height="${candleH}" preserveAspectRatio="xMidYMax meet"/>`
        );
      }
      return parts.join("\n        ");
    }

    function escapeXml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizeMessage(raw) {
      return String(raw || "")
        .replace(/\r\n/g, "\n")
        .replace(/\n+/g, " ")
        .replace(/\s+/g, " ")
        .trimStart()
        .slice(0, MESSAGE_MAX_CHARS);
    }

    function messageTooLong(raw) {
      return String(raw || "").length > MESSAGE_MAX_CHARS;
    }

    function wrapMessageLines(raw) {
      const normalized = normalizeMessage(raw);
      if (!normalized.trim()) return [];
      if (normalized.includes("\n")) {
        return normalized.split("\n").slice(0, MESSAGE_MAX_LINES);
      }
      const words = normalized.trim().split(/\s+/);
      const lines = [];
      let current = "";
      words.forEach((word) => {
        const next = current ? `${current} ${word}` : word;
        if (next.length <= MESSAGE_MAX_LINE_LEN || !current) {
          current = next.slice(0, MESSAGE_MAX_LINE_LEN);
        } else if (lines.length < MESSAGE_MAX_LINES - 1) {
          lines.push(current);
          current = word.slice(0, MESSAGE_MAX_LINE_LEN);
        } else {
          current = next.slice(0, MESSAGE_MAX_LINE_LEN);
        }
      });
      if (current) lines.push(current);
      return lines.slice(0, MESSAGE_MAX_LINES);
    }

    function approxMessageWidth(str, fontSize) {
      // Bold Libre Caslon — slightly wide so edges aren't clipped
      return String(str || "").length * fontSize * 0.58;
    }

    function getCakeTextSlot() {
      const svg = document.querySelector("#cake-preview svg");
      let scale = 1;
      if (svg) {
        const rect = svg.getBoundingClientRect();
        if (rect.width > 0) scale = rect.width / 400;
      }
      const safeScale = Math.max(scale, 0.4);
      return {
        w: Math.min(CAKE_TEXT_SLOT_W_MAX, CAKE_TEXT_TARGET_CSS_W / safeScale),
        h: Math.min(CAKE_TEXT_SLOT_H_MAX, CAKE_TEXT_TARGET_CSS_H / safeScale),
      };
    }

    function wrapMessageToWidth(raw, fontSize, maxWidth, maxLines) {
      const text = normalizeMessage(raw).trim();
      if (!text) return { lines: [], complete: true };

      const words = text.split(/\s+/);
      const lines = [];
      let current = "";
      let wordIdx = 0;

      const fits = (s) => approxMessageWidth(s, fontSize) <= maxWidth;

      const hardBreakWord = (word) => {
        const chunks = [];
        let rest = word;
        while (rest.length) {
          if (fits(rest)) {
            chunks.push(rest);
            break;
          }
          let cut = rest.length - 1;
          while (cut > 1 && !fits(rest.slice(0, cut))) cut -= 1;
          chunks.push(rest.slice(0, cut));
          rest = rest.slice(cut);
        }
        return chunks;
      };

      while (wordIdx < words.length) {
        const word = words[wordIdx];
        const candidate = current ? `${current} ${word}` : word;

        if (fits(candidate)) {
          current = candidate;
          wordIdx += 1;
          continue;
        }

        if (!current) {
          const chunks = hardBreakWord(word);
          for (let i = 0; i < chunks.length; i++) {
            if (lines.length >= maxLines) {
              return { lines, complete: false };
            }
            if (i < chunks.length - 1 || lines.length === maxLines - 1) {
              lines.push(chunks[i]);
            } else {
              current = chunks[i];
            }
          }
          if (lines.length >= maxLines && current) {
            lines[lines.length - 1] = current;
            current = "";
            wordIdx += 1;
            return { lines: lines.slice(0, maxLines), complete: wordIdx >= words.length && !current };
          }
          wordIdx += 1;
          continue;
        }

        if (lines.length >= maxLines - 1) {
          lines.push(current);
          current = "";
          return { lines: lines.slice(0, maxLines), complete: false };
        }

        lines.push(current);
        current = "";
      }

      if (current) {
        if (lines.length < maxLines) lines.push(current);
        else return { lines: lines.slice(0, maxLines), complete: false };
      }

      return { lines: lines.slice(0, maxLines), complete: true };
    }

    function fitCakeMessage(raw) {
      const text = normalizeMessage(raw).trim();
      if (!text) return null;

      const slot = getCakeTextSlot();
      const fitW = Math.max(40, slot.w - CAKE_TEXT_PAD_X * 2);
      const fitH = Math.max(20, slot.h - 2);
      let fallback = null;
      const maxFont = Math.min(36, Math.floor(fitH));

      for (let fontSize = maxFont; fontSize >= 12; fontSize -= 1) {
        const lineH = fontSize * 1.08;
        if (lineH > fitH) continue;

        const maxLinesByHeight = Math.max(1, Math.floor(fitH / lineH));
        const maxLines = Math.min(CAKE_TEXT_MAX_LINES, maxLinesByHeight);

        const { lines, complete } = wrapMessageToWidth(text, fontSize, fitW, maxLines);
        if (!lines.length) continue;

        const blockH = lines.length * lineH;
        const maxLineW = Math.max(...lines.map((l) => approxMessageWidth(l, fontSize)));
        if (maxLineW > fitW + 0.5 || blockH > fitH + 0.5) continue;

        const candidate = { fontSize, lineH, lines, blockH, slotW: slot.w, slotH: slot.h };
        if (!fallback) fallback = candidate;
        if (complete) return candidate;
      }

      return fallback;
    }

    function buildCakeTextSvg(cx, topY, rx, ry, opts) {
      const fitted = fitCakeMessage(opts.message || "");
      if (!fitted || !fitted.lines.length) return "";
      const fill = opts.textColor || "#5d3a1a";
      const { fontSize, lineH, lines, blockH, slotW, slotH } = fitted;
      const startY = topY - blockH / 2 + fontSize * 0.82;
      const tspans = lines.map((line, i) => {
        const y = startY + i * lineH;
        return `<tspan x="${cx}" y="${y.toFixed(1)}">${escapeXml(line) || "\u00a0"}</tspan>`;
      }).join("");
      const clipX = cx - slotW / 2;
      const clipY = topY - slotH / 2;
      // ~2px white outline in screen space
      const svg = document.querySelector("#cake-preview svg");
      const scale = svg?.getBoundingClientRect().width > 0
        ? svg.getBoundingClientRect().width / 400
        : 1;
      const strokeW = Math.max(1.5, 2 / Math.max(scale, 0.4));
      return `<defs><clipPath id="cake-text-clip"><rect x="${clipX.toFixed(1)}" y="${clipY.toFixed(1)}" width="${slotW.toFixed(1)}" height="${slotH.toFixed(1)}" rx="2"/></clipPath></defs>
        <text clip-path="url(#cake-text-clip)" text-anchor="middle" font-family="Libre Caslon Text, Georgia, serif" font-size="${fontSize}" font-weight="700" fill="${fill}" stroke="#ffffff" stroke-width="${strokeW.toFixed(2)}" stroke-linejoin="round" paint-order="stroke fill">${tspans}</text>`;
    }

    function buildDecorationOverlay(ids, cx, topY, rx, ry, opts) {
      if (!ids || !ids.length) return "";
      const set = new Set(ids);
      const parts = [];
      const wantsDrip = set.has("chocolate-drip");

      if (wantsDrip) parts.push(buildChocolateDrips(cx, topY, rx, ry, "back"));
      if (set.has("sugar-sticks")) {
        const colors = ["#e84670", "#f5a623", "#4caf50", "#42a5f5", "#ab47bc", "#ffee58"];
        const bits = [];
        const count = 56;
        for (let i = 0; i < count; i++) {
          const angle = (2 * Math.PI * i) / count + (i % 5) * 0.05;
          // Bias to rim; keep center clear for text/candles
          const ring = i % 3 === 0 ? 0.52 + (i % 4) * 0.04 : 0.68 + (i % 5) * 0.05;
          const r = Math.min(0.92, ring);
          const x = cx + rx * r * Math.cos(angle);
          const y = topY + ry * r * Math.sin(angle);
          const rot = (i * 41) % 180;
          const w = 1.2;
          const h = 5;
          bits.push(
            `<rect x="${(x - w / 2).toFixed(1)}" y="${(y - h / 2).toFixed(1)}" width="${w}" height="${h}" rx="0.5" fill="${colors[i % colors.length]}" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})"/>`
          );
        }
        parts.push(bits.join("\n        "));
      }
      if (set.has("mm")) {
        const colors = ["#e53935", "#1e88e5", "#43a047", "#fdd835", "#8e24aa", "#fb8c00"];
        const bits = [];
        const aspect = ry / rx; // cake-top perspective ratio
        const count = 36;
        for (let i = 0; i < count; i++) {
          const angle = (2 * Math.PI * i) / count + 0.15;
          // Bias to rim; keep center clear for text/candles
          const ring = i % 3 === 0 ? 0.52 + (i % 4) * 0.04 : 0.68 + (i % 5) * 0.05;
          const r = Math.min(0.92, ring);
          const x = cx + rx * r * Math.cos(angle);
          const y = topY + ry * r * Math.sin(angle);
          const erx = 6.5 + (i % 3) * 0.6;
          const ery = erx * aspect + 0.5; // +1px visual height
          bits.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${erx.toFixed(1)}" ry="${ery.toFixed(1)}" fill="${colors[i % colors.length]}"/>`);
        }
        parts.push(bits.join("\n        "));
      }
      if (set.has("candles")) {
        parts.push(buildCandlesSvg(cx, topY, rx, ry, opts.candleCount, opts.candleMode));
      }
      if (wantsDrip) parts.push(buildChocolateDrips(cx, topY, rx, ry, "front"));
      if (set.has("text")) parts.push(buildCakeTextSvg(cx, topY, rx, ry, opts));
      return parts.join("\n        ");
    }

    function buildCakeSvg(cm, servings, flavorColor, creamColor, decoOpts) {
      const W = 400, H = 340;
      const cx = W / 2, plateY = 270;
      const rx = 140, ry = 36;
      const bodyH = 70;
      const topY = plateY - bodyH;
      const showDiameter = !decoOpts || decoOpts.showDiameter !== false;
      const decoIds = (decoOpts && decoOpts.ids) || [];

      // Cream paints the whole outer cake; flavor only colors the 3 layer rings
      const bodyFill = creamColor ? creamColor.body : "#f5e1a4";
      const topFill = creamColor ? creamColor.top : "#fef3d0";
      const stripeFill = flavorColor || "#e8c36a";

      // 3 flavor rings — only the front (bottom) arc so the cake looks solid
      const stripeYs = [0.25, 0.5, 0.75].map((t, i) => topY + bodyH * t + 2 + (i === 1 ? 2 : 0) + (i === 2 ? 2 : 0));
      const stripeRy = ry * 0.85 + 2;
      const stripes = stripeYs.map((y, i) => {
        const sw = i === 1 ? 6 : 5;
        const op = i === 1 ? 0.85 : 0.7;
        const x1 = cx - rx;
        const x2 = cx + rx;
        const thisRy = stripeRy + (i === 2 ? 1 : 0);
        // Front half-arc only (bottom of ellipse in SVG = front of cake)
        return `<path d="M ${x1} ${y} A ${rx} ${thisRy} 0 0 0 ${x2} ${y}" fill="none" stroke="${stripeFill}" stroke-width="${sw}" stroke-linecap="round" opacity="${op}"/>`;
      }).join("\n        ");

      const sliceLines = [];
      const opacity = servings > 12 ? 0.18 : 0.3;

      // Highlight one slice facing the viewer
      const highlightIdx = Math.floor(servings / 2);
      const a1 = (2 * Math.PI * highlightIdx) / servings - Math.PI / 2;
      const a2 = (2 * Math.PI * (highlightIdx + 1)) / servings - Math.PI / 2;
      const hx1 = cx + rx * Math.cos(a1), hy1 = topY + ry * Math.sin(a1);
      const hx2 = cx + rx * Math.cos(a2), hy2 = topY + ry * Math.sin(a2);
      const largeArc = (a2 - a1 > Math.PI) ? 1 : 0;
      const hiTop = creamColor ? "rgba(255,255,255,.35)" : "rgba(255,255,240,.7)";
      const hiSide = creamColor ? "rgba(255,255,255,.22)" : "rgba(255,255,240,.5)";
      sliceLines.push(`<path d="M${cx},${topY} L${hx1.toFixed(1)},${hy1.toFixed(1)} A${rx},${ry} 0 ${largeArc},1 ${hx2.toFixed(1)},${hy2.toFixed(1)} Z" fill="${hiTop}"/>`);
      const by1 = plateY + ry * Math.sin(a1);
      const by2 = plateY + ry * Math.sin(a2);
      sliceLines.push(`<path d="M${hx1.toFixed(1)},${hy1.toFixed(1)} L${hx1.toFixed(1)},${by1.toFixed(1)} A${rx},${ry} 0 ${largeArc},1 ${hx2.toFixed(1)},${by2.toFixed(1)} L${hx2.toFixed(1)},${hy2.toFixed(1)} A${rx},${ry} 0 ${largeArc},0 ${hx1.toFixed(1)},${hy1.toFixed(1)} Z" fill="${hiSide}"/>`);

      for (let i = 0; i < servings; i++) {
        const angle = (2 * Math.PI * i) / servings - Math.PI / 2;
        const ex = cx + rx * Math.cos(angle);
        const ey = topY + ry * Math.sin(angle);
        sliceLines.push(`<line x1="${cx}" y1="${topY}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#7d4e2d" stroke-width="1" opacity="${opacity}"/>`);
        if (Math.sin(angle) > 0) {
          const bottomEy = plateY + ry * Math.sin(angle);
          sliceLines.push(`<line x1="${ex.toFixed(1)}" y1="${ey.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${bottomEy.toFixed(1)}" stroke="#7d4e2d" stroke-width="1" opacity="${opacity}"/>`);
        }
      }

      const diameterText = showDiameter
        ? `<text x="${cx}" y="${topY - 92}" text-anchor="middle" font-family="Work Sans, sans-serif" font-size="28" font-weight="700" fill="#623718">${cm} cm</text>`
        : "";
      const decoration = buildDecorationOverlay(decoIds, cx, topY, rx, ry, decoOpts || {});

      return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="${cx}" cy="${plateY + 14}" rx="${rx + 22}" ry="${ry + 8}" fill="#d4a34a"/>
        <ellipse cx="${cx}" cy="${plateY + 10}" rx="${rx + 18}" ry="${ry + 5}" fill="#e8c36a"/>
        <rect x="${cx - rx}" y="${topY}" width="${rx * 2}" height="${bodyH}" rx="0" fill="${bodyFill}"/>
        <ellipse cx="${cx}" cy="${plateY}" rx="${rx}" ry="${ry}" fill="${bodyFill}"/>
        ${stripes}
        <ellipse cx="${cx}" cy="${topY}" rx="${rx}" ry="${ry}" fill="${topFill}"/>
        ${sliceLines.join("\n        ")}
        ${decoration}
        ${diameterText}
      </svg>`;
    }

    /* ── Computed state helpers ───────────────────────── */
    function getActiveDecorationIndices() {
      const set = new Set(decorationSelected);
      if (currentStep === 4 && decorationHoverIdx != null) set.add(decorationHoverIdx);
      return [...set].sort((a, b) => a - b);
    }

    function getDecorationItemPrice(d) {
      if (!d) return 0;
      if (d.id === "candles" && d.unitPrice != null) {
        return d.unitPrice * Math.max(1, Math.min(99, cakeConfig.candleCount | 0));
      }
      return d.modifier || 0;
    }

    function getDecorationModifier(indices) {
      return (indices || []).reduce((sum, i) => sum + getDecorationItemPrice(DECORATIONS[i]), 0);
    }

    function getTotalPrice() {
      const base = SIZES[sizeSelectedIdx].price;
      const flavorMod = FLAVORS[flavorSelectedIdx].modifier;
      const creamMod = currentStep >= 3 ? CREAMS[creamSelectedIdx].modifier : 0;
      const decoMod = currentStep >= 4 ? getDecorationModifier([...decorationSelected]) : 0;
      return base + flavorMod + creamMod + decoMod;
    }

    function previewTotalPrice(sizeIdx, flavorIdx, creamIdx, decoIndices) {
      let total = SIZES[sizeIdx].price + FLAVORS[flavorIdx].modifier;
      if (creamIdx != null) total += CREAMS[creamIdx].modifier;
      if (decoIndices && decoIndices.length) total += getDecorationModifier(decoIndices);
      return total;
    }

    function syncDecorationConfig() {
      const indices = [...decorationSelected].sort((a, b) => a - b);
      cakeConfig.decoration = indices.map((i) => DECORATIONS[i].id);
      cakeConfig.decorationModifier = getDecorationModifier(indices);
      cakeConfig.candleCount = Math.max(1, Math.min(99, cakeConfig.candleCount | 0));
      cakeConfig.message = normalizeMessage(cakeConfig.message);
      cakeConfig.price = getTotalPrice();
    }

    function isDecorationSelected(idx) {
      return decorationSelected.has(idx);
    }

    function decoIconHtml(d, name, enterClass) {
      const cls = enterClass ? ` ${enterClass}` : "";
      if (d.thumb) {
        return `<img class="cfg-option-thumb${cls}" src="assets/configurator/decoration/${d.thumb}" alt="${name}">`;
      }
      return `<span class="cfg-option-glyph${cls}" aria-hidden="true">Aa</span>`;
    }

    function decoExtrasHtml(d) {
      if (!isDecorationSelected(DECORATIONS.findIndex((x) => x.id === d.id))) return "";
      if (d.id === "candles") {
        return `<div class="cfg-deco-extras" data-extras="candles">
          <input type="number" class="cfg-candle-count" min="1" max="99" value="${cakeConfig.candleCount}" aria-label="${I18n.t("cfg.candleCountLabel")}">
          <div class="cfg-candle-modes" role="group">
            <span role="button" tabindex="0" class="cfg-candle-mode${cakeConfig.candleMode === "digits" ? " is-active" : ""}" data-mode="digits">${I18n.t("cfg.candleModeDigits")}</span>
            <span role="button" tabindex="0" class="cfg-candle-mode${cakeConfig.candleMode === "sticks" ? " is-active" : ""}" data-mode="sticks">${I18n.t("cfg.candleModeSticks")}</span>
          </div>
        </div>`;
      }
      if (d.id === "text") {
        const tooLong = messageTooLong(cakeConfig.message);
        const safe = escapeXml(cakeConfig.message).replace(/"/g, "&quot;");
        return `<div class="cfg-deco-extras" data-extras="text">
          <input type="text" class="cfg-message-input${tooLong ? " is-invalid" : ""}" maxlength="${MESSAGE_MAX_CHARS}" value="${safe}" aria-label="${I18n.t("cfg.messageLabel")}" placeholder="${I18n.t("cfg.messagePlaceholder")}">
          ${tooLong ? `<span class="cfg-message-error">${I18n.t("cfg.messageTooLong")}</span>` : ""}
        </div>`;
      }
      return "";
    }

    /* ── Step 1: Servings ─────────────────────────────── */
    function renderServingsOptions() {
      const container = document.getElementById("cfg-options");
      container.innerHTML = SIZES.map((s, i) => {
        const label = I18n.t("cfg.servingsLabel").replace("{cm}", s.cm).replace("{n}", s.servings);
        return `<button type="button" class="cfg-option${i === sizeSelectedIdx ? " is-selected" : ""}" data-idx="${i}">
          <span class="cfg-option-icon"><span class="cfg-option-num">${s.servings}</span></span>
          <span class="cfg-option-body"><span class="cfg-option-label-slot"><span class="cfg-option-label">${label}</span></span></span>
        </button>`;
      }).join("");
    }

    function initOptionsDelegation() {
      const container = document.getElementById("cfg-options");
      if (!container || container.dataset.bound === "1") return;
      container.dataset.bound = "1";

      container.addEventListener("click", (e) => {
        if (e.target.closest(".cfg-deco-extras")) {
          const modeBtn = e.target.closest(".cfg-candle-mode");
          if (modeBtn) {
            e.preventDefault();
            cakeConfig.candleMode = modeBtn.dataset.mode;
            renderStep();
          }
          return;
        }
        const btn = e.target.closest(".cfg-option");
        if (!btn || isAnimating) return;
        const idx = +btn.dataset.idx;
        if (currentStep === 1) {
          sizeSelectedIdx = idx;
          sizePreviewIdx = idx;
          cakeConfig.sizeCm = SIZES[idx].cm;
          cakeConfig.servings = SIZES[idx].servings;
          cakeConfig.price = getTotalPrice();
          renderStep();
        } else if (currentStep === 2) {
          flavorSelectedIdx = idx;
          flavorPreviewIdx = idx;
          cakeConfig.flavor = FLAVORS[idx].id;
          cakeConfig.flavorModifier = FLAVORS[idx].modifier;
          cakeConfig.price = getTotalPrice();
          renderStep();
        } else if (currentStep === 3) {
          creamSelectedIdx = idx;
          creamPreviewIdx = idx;
          cakeConfig.cream = CREAMS[idx].id;
          cakeConfig.creamModifier = CREAMS[idx].modifier;
          cakeConfig.price = getTotalPrice();
          renderStep();
        } else if (currentStep === 4) {
          if (decorationSelected.has(idx)) decorationSelected.delete(idx);
          else decorationSelected.add(idx);
          decorationHoverIdx = null;
          syncDecorationConfig();
          renderStep();
        }
      });

      container.addEventListener("input", (e) => {
        if (currentStep !== 4) return;
        if (e.target.classList.contains("cfg-candle-count")) {
          let v = parseInt(e.target.value, 10);
          if (Number.isNaN(v)) v = 10;
          cakeConfig.candleCount = Math.max(1, Math.min(99, v));
          syncDecorationConfig();
          renderPreview();
          renderSummary();
        } else if (e.target.classList.contains("cfg-message-input")) {
          const tooLong = messageTooLong(e.target.value);
          const normalized = normalizeMessage(e.target.value);
          cakeConfig.message = normalized;
          if (e.target.value !== normalized) e.target.value = normalized;
          e.target.classList.toggle("is-invalid", tooLong);
          const err = e.target.parentElement.querySelector(".cfg-message-error");
          if (tooLong) {
            if (!err) {
              const span = document.createElement("span");
              span.className = "cfg-message-error";
              span.textContent = I18n.t("cfg.messageTooLong");
              e.target.parentElement.appendChild(span);
            }
          } else if (err) {
            err.remove();
          }
          renderPreview();
          renderSummary();
        }
      });

      container.addEventListener("change", (e) => {
        if (currentStep !== 4) return;
        if (e.target.classList.contains("cfg-candle-count")) {
          let v = parseInt(e.target.value, 10);
          if (Number.isNaN(v)) v = 10;
          cakeConfig.candleCount = Math.max(1, Math.min(99, v));
          e.target.value = String(cakeConfig.candleCount);
          syncDecorationConfig();
          renderPreview();
          renderSummary();
        }
      });

      container.addEventListener("keydown", (e) => {
        if (currentStep !== 4) return;
        // Space/Enter inside extras must not toggle the option row
        if (e.target.closest(".cfg-deco-extras")) {
          if (e.key === " " || e.code === "Space") e.stopPropagation();
          const modeBtn = e.target.closest(".cfg-candle-mode");
          if (modeBtn && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            cakeConfig.candleMode = modeBtn.dataset.mode;
            renderStep();
          }
          return;
        }
        const opt = e.target.closest(".cfg-option");
        if (opt && (e.target === opt || e.target.closest(".cfg-option-label-slot, .cfg-option-icon")) && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          opt.click();
        }
      });

      container.addEventListener("keyup", (e) => {
        if (currentStep !== 4) return;
        if (!e.target.closest(".cfg-deco-extras")) return;
        if (e.key === " " || e.code === "Space") {
          e.stopPropagation();
          e.preventDefault();
        }
      });

      container.addEventListener("mouseenter", (e) => {
        const btn = e.target.closest(".cfg-option");
        if (!btn || isAnimating) return;
        const idx = +btn.dataset.idx;
        if (currentStep === 1) {
          sizePreviewIdx = idx;
          renderPreview();
          renderSummary();
        } else if (currentStep === 2) {
          flavorPreviewIdx = idx;
          renderPreview();
          renderSummary();
        } else if (currentStep === 3) {
          creamPreviewIdx = idx;
          renderPreview();
          renderSummary();
        } else if (currentStep === 4) {
          decorationHoverIdx = idx;
          renderPreview();
          renderSummary();
        }
      }, true);

      container.addEventListener("mouseleave", (e) => {
        const btn = e.target.closest(".cfg-option");
        if (!btn || isAnimating) return;
        if (currentStep === 1) {
          sizePreviewIdx = sizeSelectedIdx;
          renderPreview();
          renderSummary();
        } else if (currentStep === 2) {
          flavorPreviewIdx = flavorSelectedIdx;
          renderPreview();
          renderSummary();
        } else if (currentStep === 3) {
          creamPreviewIdx = creamSelectedIdx;
          renderPreview();
          renderSummary();
        } else if (currentStep === 4) {
          decorationHoverIdx = null;
          renderPreview();
          renderSummary();
        }
      }, true);
    }

    /* ── Step 2: Flavor ───────────────────────────────── */
    function renderFlavorOptions() {
      const container = document.getElementById("cfg-options");
      container.innerHTML = FLAVORS.map((f, i) => {
        const name = I18n.t("cfg.flavor." + f.id);
        return `<button type="button" class="cfg-option${i === flavorSelectedIdx ? " is-selected" : ""}" data-idx="${i}" data-flavor="${f.id}">
          <span class="cfg-option-icon"><img class="cfg-option-thumb" src="assets/configurator/flavor/${f.id}.png" alt="${name}"></span>
          <span class="cfg-option-body"><span class="cfg-option-label-slot"><span class="cfg-option-label">${name}</span></span></span>
        </button>`;
      }).join("");
    }

    /* ── Step 3: Cream / coating ──────────────────────── */
    function renderCreamOptions() {
      const container = document.getElementById("cfg-options");
      container.innerHTML = CREAMS.map((c, i) => {
        const name = I18n.t("cfg.cream." + c.id);
        return `<button type="button" class="cfg-option${i === creamSelectedIdx ? " is-selected" : ""}" data-idx="${i}" data-cream="${c.id}">
          <span class="cfg-option-icon"><img class="cfg-option-thumb" src="assets/configurator/cream/${c.id}.png" alt="${name}"></span>
          <span class="cfg-option-body"><span class="cfg-option-label-slot"><span class="cfg-option-label">${name}</span></span></span>
        </button>`;
      }).join("");
    }

    /* ── Step 4: Decoration ───────────────────────────── */
    function renderDecorationOptions() {
      const container = document.getElementById("cfg-options");
      container.innerHTML = DECORATIONS.map((d, i) => {
        const name = I18n.t("cfg.deco." + d.id);
        const extras = decoExtrasHtml(d);
        if (d.id === "text") {
          return `<div role="button" tabindex="0" class="cfg-option${isDecorationSelected(i) ? " is-selected" : ""}" data-idx="${i}" data-deco="${d.id}">
            <span class="cfg-option-icon">${decoIconHtml(d, name)}</span>
            <span class="cfg-option-body">
              <span class="cfg-option-label-slot"><span class="cfg-option-label">${name}</span></span>
            </span>
            ${extras}
          </div>`;
        }
        return `<div role="button" tabindex="0" class="cfg-option${isDecorationSelected(i) ? " is-selected" : ""}" data-idx="${i}" data-deco="${d.id}">
          <span class="cfg-option-icon">${decoIconHtml(d, name)}</span>
          <span class="cfg-option-body">
            <span class="cfg-option-label-slot"><span class="cfg-option-label">${name}</span></span>
            ${extras}
          </span>
        </div>`;
      }).join("");
    }

    function renderStepPlaceholder() {
      const container = document.getElementById("cfg-options");
      container.innerHTML = "";
    }

    function setNextButtonLabel() {
      const nextBtn = document.getElementById("cfg-next");
      if (!nextBtn) return;
      nextBtn.textContent = currentStep >= 5 ? I18n.t("cfg.addToCart") : I18n.t("cfg.next");
    }

    function buildCakeCartPayload() {
      syncDecorationConfig();
      const decoIds = cakeConfig.decoration || [];
      const decorationLines = decoIds.map((id) => {
        if (id === "candles") {
          return `${I18n.t("cfg.deco.candles")}: ${I18n.t("cfg.candlePcs").replace("{n}", String(cakeConfig.candleCount))}`;
        }
        if (id === "text") {
          const msg = cakeConfig.message.trim();
          return msg
            ? `${I18n.t("cfg.cartTextShort")}: „${msg}”`
            : I18n.t("cfg.deco.text");
        }
        return I18n.t("cfg.deco." + id);
      });
      const summaryLines = [
        `${cakeConfig.sizeCm} cm · ${I18n.t("cfg.cartServings").replace("{n}", String(cakeConfig.servings))}`,
        I18n.t("cfg.flavor." + cakeConfig.flavor),
        I18n.t("cfg.cream." + cakeConfig.cream),
      ];
      if (decorationLines.length) {
        summaryLines.push(I18n.t("cfg.cartDecorations").replace("{n}", String(decorationLines.length)));
      }
      return {
        id: "custom-cake-" + Date.now(),
        type: "custom-cake",
        name: I18n.t("cfg.customCake"),
        detail: summaryLines.join(" · "),
        summaryLines,
        decorationLines,
        price: cakeConfig.price || getTotalPrice(),
        img: "assets/configurator/flavor/" + cakeConfig.flavor + ".png",
      };
    }

    function openCartPopover() {
      const popover = document.getElementById("header-cart-popover");
      const toggle = document.getElementById("header-cart-btn");
      renderCartPopover();
      popover?.classList.add("is-open");
      toggle?.setAttribute("aria-expanded", "true");
    }

    function addConfiguredCakeToCart() {
      Cart.addToCart(buildCakeCartPayload());
      // Defer open so the same click's document listener doesn't immediately close it
      setTimeout(() => openCartPopover(), 0);
    }

    function flipMove(els, applyLayout) {
      const first = els.map((el) => el.getBoundingClientRect());
      applyLayout();
      const last = els.map((el) => el.getBoundingClientRect());
      els.forEach((el, i) => {
        const dx = first[i].left - last[i].left;
        const dy = first[i].top - last[i].top;
        el.style.transition = "none";
        el.style.transform = `translate(${dx}px, ${dy}px)`;
      });
      // force reflow
      void document.body.offsetWidth;
      return new Promise((resolve) => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            els.forEach((el) => {
              el.style.transition = "transform .7s cubic-bezier(0.23, 1, 0.32, 1)";
              el.style.transform = "translate(0, 0)";
            });
            setTimeout(() => {
              els.forEach((el) => {
                el.style.transition = "";
                el.style.transform = "";
              });
              resolve();
            }, 720);
          });
        });
      });
    }

    async function transitionToSummary() {
      const body = document.querySelector(".cfg-body");
      const options = document.getElementById("cfg-options");
      const preview = document.getElementById("cake-preview");
      const summary = document.getElementById("cfg-summary");
      const rightCol = document.querySelector(".cfg-right-col");
      const buttons = [...options.querySelectorAll(".cfg-option")];
      const stagger = 90;
      options.classList.add("is-exiting");
      options.style.overflow = "visible";

      buttons.forEach((btn, i) => {
        setTimeout(() => btn.classList.add("is-fly-out"), i * stagger);
      });

      await wait(480 + buttons.length * stagger);

      summaryDecoExpanded = false;
      setNextButtonLabel();
      await flipMove([preview, summary, rightCol], () => {
        body?.classList.add("is-summary");
        options.innerHTML = "";
        options.classList.remove("is-exiting");
        options.style.overflow = "";
        renderSummary();
        renderDots();
      });
    }

    async function transitionFromSummary() {
      const body = document.querySelector(".cfg-body");
      const preview = document.getElementById("cake-preview");
      const summary = document.getElementById("cfg-summary");
      const rightCol = document.querySelector(".cfg-right-col");
      const options = document.getElementById("cfg-options");

      summaryDecoExpanded = false;
      setNextButtonLabel();

      await flipMove([preview, summary, rightCol], () => {
        body?.classList.remove("is-summary");
        renderDecorationOptions();
        renderSummary();
        renderDots();
      });

      const buttons = [...options.querySelectorAll(".cfg-option")];
      const stagger = 90;
      options.style.overflow = "visible";
      buttons.forEach((btn) => btn.classList.add("is-fly-in"));
      void options.offsetWidth;
      buttons.forEach((btn, i) => {
        setTimeout(() => {
          btn.classList.add("is-fly-in-active");
          btn.classList.remove("is-fly-in");
        }, i * stagger);
      });

      await wait(700 + buttons.length * stagger);
      buttons.forEach((btn) => btn.classList.remove("is-fly-in-active"));
      options.style.overflow = "";
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function modeOptionCount(mode) {
      if (mode === "flavor") return FLAVORS.length;
      if (mode === "cream") return CREAMS.length;
      if (mode === "decoration") return DECORATIONS.length;
      return SIZES.length;
    }

    function applyButtonMeta(btn, i, mode) {
      btn.dataset.idx = String(i);
      delete btn.dataset.flavor;
      delete btn.dataset.cream;
      delete btn.dataset.deco;
      btn.removeAttribute("data-flavor");
      btn.removeAttribute("data-cream");
      btn.removeAttribute("data-deco");

      // Normalize body structure for label slot
      let body = btn.querySelector(".cfg-option-body");
      if (!body) {
        const slot = btn.querySelector(".cfg-option-label-slot");
        body = document.createElement("span");
        body.className = "cfg-option-body";
        if (slot) {
          slot.replaceWith(body);
          body.appendChild(slot);
        } else {
          btn.appendChild(body);
          const newSlot = document.createElement("span");
          newSlot.className = "cfg-option-label-slot";
          newSlot.innerHTML = `<span class="cfg-option-label"></span>`;
          body.appendChild(newSlot);
        }
      }
      body.querySelectorAll(".cfg-deco-extras").forEach((el) => el.remove());
      btn.querySelectorAll(":scope > .cfg-deco-extras").forEach((el) => el.remove());

      if (mode === "flavor") {
        const f = FLAVORS[i];
        btn.dataset.flavor = f.id;
        btn.classList.toggle("is-selected", i === flavorSelectedIdx);
        return I18n.t("cfg.flavor." + f.id);
      }
      if (mode === "cream") {
        const c = CREAMS[i];
        btn.dataset.cream = c.id;
        btn.classList.toggle("is-selected", i === creamSelectedIdx);
        return I18n.t("cfg.cream." + c.id);
      }
      if (mode === "decoration") {
        const d = DECORATIONS[i];
        btn.dataset.deco = d.id;
        btn.classList.toggle("is-selected", isDecorationSelected(i));
        const extras = decoExtrasHtml(d);
        if (extras) {
          if (d.id === "text") btn.insertAdjacentHTML("beforeend", extras);
          else body.insertAdjacentHTML("beforeend", extras);
        }
        return I18n.t("cfg.deco." + d.id);
      }
      const s = SIZES[i];
      btn.classList.toggle("is-selected", i === sizeSelectedIdx);
      return I18n.t("cfg.servingsLabel").replace("{cm}", s.cm).replace("{n}", s.servings);
    }

    function swapIcon(btn, i, mode, direction) {
      const iconWrap = btn.querySelector(".cfg-option-icon");
      const enterFrom = direction > 0 ? "icon-enter-from-right" : "icon-enter-from-left";
      let html;
      if (mode === "flavor") {
        const f = FLAVORS[i];
        const name = I18n.t("cfg.flavor." + f.id);
        html = `<img class="cfg-option-thumb ${enterFrom}" src="assets/configurator/flavor/${f.id}.png" alt="${name}">`;
      } else if (mode === "cream") {
        const c = CREAMS[i];
        const name = I18n.t("cfg.cream." + c.id);
        html = `<img class="cfg-option-thumb ${enterFrom}" src="assets/configurator/cream/${c.id}.png" alt="${name}">`;
      } else if (mode === "decoration") {
        const d = DECORATIONS[i];
        const name = I18n.t("cfg.deco." + d.id);
        html = decoIconHtml(d, name, enterFrom);
      } else {
        html = `<span class="cfg-option-num ${enterFrom}">${SIZES[i].servings}</span>`;
      }
      iconWrap.innerHTML = html;
      const el = iconWrap.firstElementChild;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          el.classList.remove(enterFrom);
          el.classList.add("icon-enter-active");
          setTimeout(() => {
            el.classList.remove("icon-enter-active");
          }, 600);
        });
      });
    }

    function swapLabel(btn, newText) {
      let slot = btn.querySelector(".cfg-option-label-slot");
      if (!slot) {
        const body = btn.querySelector(".cfg-option-body") || btn;
        slot = document.createElement("span");
        slot.className = "cfg-option-label-slot";
        slot.innerHTML = `<span class="cfg-option-label"></span>`;
        body.prepend(slot);
      }
      const old = slot.querySelector(".cfg-option-label");
      if (!old) {
        slot.innerHTML = `<span class="cfg-option-label">${newText}</span>`;
        return;
      }
      old.classList.add("label-exit-up");

      const neu = document.createElement("span");
      neu.className = "cfg-option-label label-enter-from-below";
      neu.textContent = newText;
      slot.appendChild(neu);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          neu.classList.add("label-enter-active");
        });
      });

      setTimeout(() => {
        // Replace with a clean static label to avoid absolute → flow jump
        slot.innerHTML = "";
        const final = document.createElement("span");
        final.className = "cfg-option-label";
        final.textContent = newText;
        slot.appendChild(final);
      }, 1150);
    }

    async function animateIconsEnter(direction) {
      const buttons = [...document.querySelectorAll("#cfg-options .cfg-option")];
      const stagger = 90;
      const enterFrom = direction > 0 ? "icon-enter-from-right" : "icon-enter-from-left";
      buttons.forEach((btn, i) => {
        const el = btn.querySelector(".cfg-option-icon > *");
        if (!el) return;
        el.classList.add(enterFrom);
        setTimeout(() => {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              el.classList.remove(enterFrom);
              el.classList.add("icon-enter-active");
              setTimeout(() => el.classList.remove("icon-enter-active"), 600);
            });
          });
        }, i * stagger);
      });
      await wait(700 + buttons.length * stagger);
    }

    /* Per-button staggered transition: icon horizontal + label vertical */
    async function transitionOptions(direction, mode) {
      const buttons = [...document.querySelectorAll("#cfg-options .cfg-option")];
      const stagger = 90;
      const exitClass = direction > 0 ? "icon-exit-left" : "icon-exit-right";
      const targetCount = modeOptionCount(mode);

      buttons.forEach((btn, i) => {
        setTimeout(() => {
          const icon = btn.querySelector(".cfg-option-icon > *");
          icon?.classList.add(exitClass);
        }, i * stagger);
      });

      await wait(480);

      if (buttons.length !== targetCount) {
        if (mode === "decoration") renderDecorationOptions();
        else if (mode === "cream") renderCreamOptions();
        else if (mode === "flavor") renderFlavorOptions();
        else renderServingsOptions();
        await animateIconsEnter(direction);
        return;
      }

      buttons.forEach((btn, i) => {
        setTimeout(() => {
          const newText = applyButtonMeta(btn, i, mode);
          swapIcon(btn, i, mode, direction);
          swapLabel(btn, newText);
        }, i * stagger);
      });

      await wait(1200 + buttons.length * stagger);
    }

    /* ── Shared renders ───────────────────────────────── */
    function renderPreview() {
      const previewEl = document.getElementById("cake-preview");
      const bgStep = Math.min(5, Math.max(1, currentStep | 0));
      previewEl.style.backgroundImage = `url("assets/configurator/cacke-bg/step${bgStep}.jpg")`;
      previewEl.dataset.step = String(bgStep);

      const s = SIZES[currentStep === 1 ? sizePreviewIdx : sizeSelectedIdx];
      const flavorColor = currentStep >= 2
        ? FLAVORS[currentStep === 2 ? flavorPreviewIdx : flavorSelectedIdx].color
        : null;
      const creamIdx = currentStep >= 3 ? creamPreviewIdx : null;
      const creamColor = creamIdx != null ? CREAMS[creamIdx].color : null;
      let decoOpts = null;
      if (currentStep >= 4) {
        const indices = getActiveDecorationIndices();
        const creamId = CREAMS[creamSelectedIdx].id;
        decoOpts = {
          showDiameter: false,
          ids: indices.map((i) => DECORATIONS[i].id),
          candleCount: cakeConfig.candleCount,
          candleMode: cakeConfig.candleMode,
          message: cakeConfig.message,
          textColor: creamId === "chocolate" ? "#ffffff" : "#5d3a1a",
        };
      }
      previewEl.innerHTML = buildCakeSvg(s.cm, s.servings, flavorColor, creamColor, decoOpts);
    }

    function renderSummary() {
      const t = I18n.t.bind(I18n);
      const nf = new Intl.NumberFormat("hu-HU");
      const s = SIZES[currentStep === 1 ? sizePreviewIdx : sizeSelectedIdx];
      const fIdx = currentStep === 2 ? flavorPreviewIdx : flavorSelectedIdx;
      const f = FLAVORS[fIdx];
      const cIdx = currentStep >= 3 ? creamPreviewIdx : null;
      const creamModIdx = currentStep >= 3 ? creamPreviewIdx : creamSelectedIdx;
      const decoIndices = currentStep >= 4 ? getActiveDecorationIndices() : [];
      const cream = creamModIdx != null ? CREAMS[creamModIdx] : null;
      const decoTotal = currentStep >= 4 ? getDecorationModifier(decoIndices) : 0;
      const totalPrice = previewTotalPrice(
        currentStep === 1 ? sizePreviewIdx : sizeSelectedIdx,
        fIdx,
        currentStep >= 3 ? creamModIdx : null,
        currentStep >= 4 ? decoIndices : null
      );

      let flavorText = "";
      if (currentStep >= 2) {
        const fName = I18n.t("cfg.flavor." + f.id);
        flavorText = f.modifier > 0 ? `${fName} +${nf.format(f.modifier)} Ft` : fName;
      }

      let creamText = "";
      if (currentStep >= 3 && cIdx != null) {
        const c = CREAMS[cIdx];
        const cName = I18n.t("cfg.cream." + c.id);
        creamText = c.modifier > 0 ? `${cName} +${nf.format(c.modifier)} Ft` : cName;
      }

      function formatDecoPart(d, expanded) {
        const dName = I18n.t("cfg.deco." + d.id);
        const price = getDecorationItemPrice(d);
        const priceTxt = price > 0 ? ` +${nf.format(price)} Ft` : "";
        if (d.id === "candles") {
          const n = Math.max(1, Math.min(99, cakeConfig.candleCount | 0));
          if (expanded) {
            const unit = d.unitPrice != null ? d.unitPrice : d.modifier;
            return `${dName}: ${I18n.t("cfg.candleBreakdown")
              .replace("{n}", String(n))
              .replace("{unit}", nf.format(unit))
              .replace("{total}", nf.format(price))}`;
          }
          return `${dName}${priceTxt}`;
        }
        if (d.id === "text" && cakeConfig.message.trim()) {
          const msg = cakeConfig.message.trim();
          return expanded ? `${dName}: „${msg}”${priceTxt}` : `${dName}${priceTxt} „${msg}”`;
        }
        return `${dName}${priceTxt}`;
      }

      let decoText = "";
      let decoHtmlCollapsed = "";
      let decoHtmlExpanded = "";
      let decoNeedsToggle = false;
      if (currentStep >= 4 && decoIndices.length) {
        const partsExpanded = decoIndices.map((i) => formatDecoPart(DECORATIONS[i], true));
        decoText = I18n.t("cfg.decoCount").replace("{n}", String(decoIndices.length));
        decoHtmlCollapsed = `${t("cfg.summaryDecoration")}: ${decoText}`;
        decoHtmlExpanded = `
          <div class="cfg-summary-deco-title">${t("cfg.summaryDecoration")}:</div>
          <ul class="cfg-summary-deco-list">
            ${partsExpanded.map((p) => `<li>${p}</li>`).join("")}
          </ul>`;
        decoNeedsToggle = true;
      }

      const decoLi = decoNeedsToggle
        ? `<li class="cfg-summary-deco">
            <div class="cfg-summary-deco-head">
              <span class="cfg-summary-deco-text">${summaryDecoExpanded ? decoHtmlExpanded : decoHtmlCollapsed}</span>
              <button type="button" class="cfg-summary-deco-toggle" aria-expanded="${summaryDecoExpanded ? "true" : "false"}" aria-label="${t("cfg.summaryDecoration")}">
                <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
              </button>
            </div>
          </li>`
        : `<li>${t("cfg.summaryDecoration")}: ${decoText}</li>`;

      const showBreakdown = summaryDecoExpanded && decoNeedsToggle;
      let priceHtml;
      if (showBreakdown) {
        const flavorLine = f.modifier > 0
          ? `${t("cfg.summaryFlavor")}: +${nf.format(f.modifier)} Ft`
          : `${t("cfg.summaryFlavor")}: ${t("cfg.summaryIncluded")}`;
        const creamLine = cream
          ? (cream.modifier > 0
            ? `${t("cfg.summaryCream")}: +${nf.format(cream.modifier)} Ft`
            : `${t("cfg.summaryCream")}: ${t("cfg.summaryIncluded")}`)
          : "";
        priceHtml = `
          <div class="cfg-summary-breakdown">
            <div>${t("cfg.summaryBase")}: ${nf.format(s.price)} Ft</div>
            <div>${flavorLine}</div>
            ${creamLine ? `<div>${creamLine}</div>` : ""}
            <div>${t("cfg.summaryDecorationsTotal")}: +${nf.format(decoTotal)} Ft</div>
            <div class="cfg-summary-total">${t("cfg.summaryTotal")}: ${nf.format(totalPrice)} Ft</div>
          </div>`;
      } else {
        priceHtml = `<div class="cfg-summary-price">${t("cfg.summaryPrice")}: ${nf.format(totalPrice)} Ft</div>`;
      }

      const summaryEl = document.getElementById("cfg-summary");
      summaryEl.classList.toggle("is-deco-expanded", showBreakdown);
      summaryEl.innerHTML = `
        <ul class="cfg-summary-list">
          <li>${t("cfg.summarySize")}: ${s.cm} cm</li>
          <li>${t("cfg.summaryServings")}: ${s.servings}</li>
          <li>${t("cfg.summaryFlavor")}: ${flavorText}</li>
          <li>${t("cfg.summaryCream")}: ${creamText}</li>
          ${decoLi}
        </ul>
        ${priceHtml}
      `;
    }

    function renderDots() {
      const container = document.getElementById("cfg-dots");
      container.innerHTML = Array.from({ length: TOTAL_STEPS }, (_, i) =>
        `<div class="cfg-dot${i < currentStep ? " is-active" : ""}"></div>`
      ).join("");
    }

    function renderStep() {
      const titleEl = document.getElementById("cfg-page-title");
      const backLink = document.querySelector(".top-bar-back");
      const nav = document.getElementById("cfg-nav");
      const body = document.querySelector(".cfg-body");
      const showStepBack = currentStep > 1;

      nav?.classList.toggle("has-back", showStepBack);
      body?.classList.toggle("is-summary", currentStep === 5);

      if (backLink) {
        backLink.textContent = "←";
        backLink.setAttribute("aria-label", I18n.t("cfg.back"));
        backLink.href = "elorendeles.html";
      }

      if (currentStep === 1) {
        titleEl.textContent = I18n.t("cfg.stepServings");
        renderServingsOptions();
      } else if (currentStep === 2) {
        titleEl.textContent = I18n.t("cfg.stepFlavor");
        renderFlavorOptions();
      } else if (currentStep === 3) {
        titleEl.textContent = I18n.t("cfg.stepCream");
        renderCreamOptions();
      } else if (currentStep === 4) {
        titleEl.textContent = I18n.t("cfg.stepDecoration");
        renderDecorationOptions();
      } else {
        titleEl.textContent = I18n.t("cfg.stepSummary");
        summaryDecoExpanded = false;
        renderStepPlaceholder();
      }
      setNextButtonLabel();
      renderPreview();
      renderSummary();
      renderDots();
    }

    let isAnimating = false;

    async function goNext() {
      if (isAnimating) return;
      if (currentStep === 5) {
        addConfiguredCakeToCart();
        return;
      }
      if (currentStep >= TOTAL_STEPS) return;
      if (currentStep === 1) {
        isAnimating = true;
        currentStep = 2;
        document.getElementById("cfg-page-title").textContent = I18n.t("cfg.stepFlavor");
        document.getElementById("cfg-nav")?.classList.add("has-back");
        setNextButtonLabel();
        renderPreview();
        renderSummary();
        renderDots();
        await transitionOptions(1, "flavor");
        isAnimating = false;
        return;
      }
      if (currentStep === 2) {
        isAnimating = true;
        currentStep = 3;
        cakeConfig.cream = CREAMS[creamSelectedIdx].id;
        cakeConfig.creamModifier = CREAMS[creamSelectedIdx].modifier;
        cakeConfig.price = getTotalPrice();
        creamPreviewIdx = creamSelectedIdx;
        document.getElementById("cfg-page-title").textContent = I18n.t("cfg.stepCream");
        document.getElementById("cfg-nav")?.classList.add("has-back");
        setNextButtonLabel();
        renderPreview();
        renderSummary();
        renderDots();
        await transitionOptions(1, "cream");
        isAnimating = false;
        return;
      }
      if (currentStep === 3) {
        isAnimating = true;
        currentStep = 4;
        creamPreviewIdx = creamSelectedIdx;
        decorationHoverIdx = null;
        syncDecorationConfig();
        document.getElementById("cfg-page-title").textContent = I18n.t("cfg.stepDecoration");
        document.getElementById("cfg-nav")?.classList.add("has-back");
        setNextButtonLabel();
        renderPreview();
        renderSummary();
        renderDots();
        await transitionOptions(1, "decoration");
        isAnimating = false;
        return;
      }
      if (currentStep === 4) {
        isAnimating = true;
        currentStep = 5;
        syncDecorationConfig();
        document.getElementById("cfg-page-title").textContent = I18n.t("cfg.stepSummary");
        document.getElementById("cfg-nav")?.classList.add("has-back");
        setNextButtonLabel();
        renderPreview();
        renderDots();
        await transitionToSummary();
        isAnimating = false;
        return;
      }
    }

    async function goBack() {
      if (isAnimating || currentStep <= 1) return;
      if (currentStep === 2) {
        isAnimating = true;
        currentStep = 1;
        document.getElementById("cfg-page-title").textContent = I18n.t("cfg.stepServings");
        document.getElementById("cfg-nav")?.classList.remove("has-back");
        setNextButtonLabel();
        renderPreview();
        renderSummary();
        renderDots();
        await transitionOptions(-1, "servings");
        isAnimating = false;
        return;
      }
      if (currentStep === 3) {
        isAnimating = true;
        currentStep = 2;
        document.getElementById("cfg-page-title").textContent = I18n.t("cfg.stepFlavor");
        document.getElementById("cfg-nav")?.classList.add("has-back");
        setNextButtonLabel();
        renderPreview();
        renderSummary();
        renderDots();
        await transitionOptions(-1, "flavor");
        isAnimating = false;
        return;
      }
      if (currentStep === 4) {
        isAnimating = true;
        currentStep = 3;
        creamPreviewIdx = creamSelectedIdx;
        document.getElementById("cfg-page-title").textContent = I18n.t("cfg.stepCream");
        document.getElementById("cfg-nav")?.classList.add("has-back");
        setNextButtonLabel();
        renderPreview();
        renderSummary();
        renderDots();
        await transitionOptions(-1, "cream");
        isAnimating = false;
        return;
      }
      if (currentStep === 5) {
        isAnimating = true;
        currentStep = 4;
        document.getElementById("cfg-page-title").textContent = I18n.t("cfg.stepDecoration");
        document.getElementById("cfg-nav")?.classList.add("has-back");
        setNextButtonLabel();
        renderPreview();
        await transitionFromSummary();
        isAnimating = false;
        return;
      }
      currentStep--;
      renderStep();
    }

    /* ── Cart popover ─────────────────────────────────── */
    function renderCartPopover() {
      const container = document.getElementById("header-cart-items");
      const totalEl = document.getElementById("header-cart-total");
      const checkoutBtn = document.getElementById("header-cart-checkout");
      const pastOrdersBtn = document.getElementById("header-cart-past-orders");
      if (!container) return;
      const cartItems = Cart.loadCart();
      Cart.updateCartBadges(cartItems);
      container.innerHTML = Cart.renderCartLines(cartItems, { removable: true });
      const sum = cartItems.reduce((a, c) => a + c.price * (c.qty || 1), 0);
      totalEl.textContent = new Intl.NumberFormat("hu-HU").format(sum) + " Ft";
      const hasItems = cartItems.length > 0;
      checkoutBtn?.classList.toggle("is-disabled", !hasItems);
      checkoutBtn?.setAttribute("aria-disabled", hasItems ? "false" : "true");
      const hasPastOrders = (Cart.loadOrders?.() || []).length > 0;
      pastOrdersBtn?.classList.toggle("hidden", !hasPastOrders);
      Cart.bindRemoveButtons(container, () => renderCartPopover());
    }

    function initLangDropdown() {
      const root = document.getElementById("lang-switcher");
      const toggle = document.getElementById("lang-switcher-toggle");
      const menu = document.getElementById("lang-switcher-menu");
      const current = document.getElementById("lang-switcher-current");
      if (!root || !toggle || !menu || !current) return;

      function syncCurrent() {
        current.textContent = (I18n.getLang() || "hu").toUpperCase();
      }

      function closeLang() {
        root.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
        menu.hidden = true;
      }

      function openLang() {
        root.classList.add("is-open");
        toggle.setAttribute("aria-expanded", "true");
        menu.hidden = false;
      }

      syncCurrent();

      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        if (root.classList.contains("is-open")) closeLang();
        else openLang();
      });

      menu.addEventListener("click", (e) => {
        const btn = e.target.closest(".lang-btn");
        if (!btn) return;
        e.stopPropagation();
        closeLang();
        syncCurrent();
      });

      document.addEventListener("click", (e) => {
        if (e.target.closest("#lang-switcher")) return;
        closeLang();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeLang();
      });
      document.addEventListener("babusgatos:langchange", syncCurrent);

      root._closeLang = closeLang;
    }

    function initCartPopover() {
      const toggle = document.getElementById("header-cart-btn");
      const popover = document.getElementById("header-cart-popover");
      if (!toggle || !popover) return;

      function closeAll() {
        popover.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
        document.getElementById("lang-switcher")?._closeLang?.();
      }

      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        const willOpen = !popover.classList.contains("is-open");
        closeAll();
        if (willOpen) {
          renderCartPopover();
          popover.classList.add("is-open");
          toggle.setAttribute("aria-expanded", "true");
        }
      });

      document.addEventListener("click", (e) => {
        if (e.target.closest(".header-cart-wrap")) return;
        closeAll();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAll();
      });
    }

    /* ── Init ─────────────────────────────────────────── */
    document.addEventListener("DOMContentLoaded", () => {
      I18n.init();
      initLangDropdown();
      initCartPopover();
      initOptionsDelegation();
      renderCartPopover();
      renderStep();

      document.addEventListener("babusgatos:langchange", () => { renderStep(); renderCartPopover(); });
      document.addEventListener("babusgatos:cartchange", () => renderCartPopover());
      document.addEventListener("babusgatos:orderschange", () => renderCartPopover());

      document.getElementById("cfg-next").addEventListener("click", goNext);
      document.getElementById("cfg-back").addEventListener("click", goBack);
      document.getElementById("cfg-summary").addEventListener("click", (e) => {
        const toggle = e.target.closest(".cfg-summary-deco-toggle");
        if (!toggle) return;
        e.preventDefault();
        summaryDecoExpanded = !summaryDecoExpanded;
        renderSummary();
      });
    });

    window.__cakeConfig = cakeConfig;
  })();
  </script>
</body>
</html>
