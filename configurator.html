<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Babusgatós — Torta összeállítás</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;600;700&family=Work+Sans:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #623718;
      --on-primary: #ffffff;
      --primary-container: #7d4e2d;
      --secondary-container: #ffd87c;
      --on-secondary-container: #795d08;
      --surface: #fff8f5;
      --on-surface: #1e1b18;
      --on-surface-variant: #51443c;
      --outline: #84746b;
      --outline-variant: #d6c3b8;
      --ink: #1e1b18;
      --muted: #51443c;
      --brown: #623718;
      --paper: #fff8f5;
      --line: #d6c3b8;
      --radius-btn: 0.5rem;
      --shadow-soft: 0 4px 14px rgba(125, 78, 45, 0.1);
      --shadow-medium: 0 8px 22px rgba(125, 78, 45, 0.16);
      font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #fff9ef 0%, #f4eee6 45%, #eef3ee 100%);
    }
    button {
      font: inherit;
      cursor: pointer;
      transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .15s ease;
    }
    button:focus-visible {
      outline: 2px solid var(--secondary-container);
      outline-offset: 2px;
    }
    .page { width: min(1440px, 100%); margin: 0 auto; padding: 24px; }
    .shell {
      border: 1px solid rgba(65, 47, 38, .13);
      border-radius: 12px;
      overflow: visible;
      background: var(--paper);
      box-shadow: 0 26px 70px rgba(54, 38, 28, .18);
    }
    .top-bar {
      position: relative;
      z-index: 30;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.85);
      border-radius: 12px 12px 0 0;
    }
    .top-bar-back {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      color: var(--brown);
      font-weight: 700;
      text-decoration: none;
      font-size: 22px;
      line-height: 1;
      border-radius: 9999px;
    }
    .top-bar-back:hover { background: rgba(98, 55, 24, .06); }
    .top-bar strong {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: clamp(14px, 2.8vw, 18px);
      line-height: 1.25;
    }
    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .lang-switcher {
      position: relative;
      display: inline-block;
    }
    .lang-switcher-toggle {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-width: 52px;
      height: 32px;
      padding: 0 6px 0 10px;
      border: 1px solid var(--outline-variant);
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: var(--brown);
      cursor: pointer;
    }
    .lang-switcher-toggle .material-symbols-outlined {
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      transition: transform .2s ease;
    }
    .lang-switcher.is-open .lang-switcher-toggle .material-symbols-outlined {
      transform: rotate(180deg);
    }
    .lang-switcher-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      min-width: 72px;
      padding: 4px;
      border: 1px solid var(--outline-variant);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(54, 38, 28, .16);
    }
    .lang-switcher-menu[hidden] {
      display: none !important;
    }
    .lang-btn {
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-align: left;
    }
    .lang-btn:hover { background: rgba(98, 55, 24, .06); }
    .lang-btn--active {
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }
    .header-cart-wrap { position: relative; }
    .top-bar-cart {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 9999px;
      color: var(--brown);
      background: transparent;
      cursor: pointer;
    }
    .top-bar-cart:hover { background: rgba(98, 55, 24, .06); }
    .top-bar-cart .material-symbols-outlined { font-size: 24px; line-height: 1; }
    .header-cart-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 9999px;
      background: var(--brown);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
    }
    .cart-popover {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: min(340px, calc(100vw - 24px));
      z-index: 80;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(54, 38, 28, .18);
      padding: 16px;
      display: none;
    }
    .cart-popover.is-open { display: block; }
    .cart-popover h3 { margin: 0 0 12px; font-size: 18px; font-weight: 700; color: var(--brown); }
    .cart-popover .cart-empty { padding: 16px 8px; color: var(--muted); font-size: 13px; line-height: 1.45; text-align: center; border: 1px dashed var(--line); border-radius: 8px; margin: 0 0 12px; }
    .cart-popover .cart-line { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .cart-popover .cart-line img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .cart-popover .cart-line--cake { align-items: start; }
    .cart-popover .cart-line-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .cart-popover .cart-line-main strong {
      font-size: 14px;
      color: var(--brown);
    }
    .cart-popover .cart-line-detail {
      display: block;
      font-size: 12px;
      line-height: 1.35;
      color: var(--muted);
    }
    .cart-popover .cart-line-price {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 800;
      color: var(--brown);
    }
    .cart-popover .cart-cake-toggle {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-top: 4px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--brown);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }
    .cart-popover .cart-cake-toggle .material-symbols-outlined {
      font-size: 16px;
      transition: transform .2s ease;
    }
    .cart-popover .cart-cake-toggle.is-open .material-symbols-outlined {
      transform: rotate(180deg);
    }
    .cart-popover .cart-cake-deco-list {
      list-style: disc;
      margin: 4px 0 0;
      padding-left: 16px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--muted);
    }
    .cart-popover .cart-line-remove {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      box-shadow: none;
    }
    .cart-popover .cart-line-remove:hover {
      color: var(--brown);
      background: transparent;
    }
    .cart-popover .cart-line-remove .material-symbols-outlined {
      font-size: 18px;
    }
    .cart-popover .total { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 16px; font-weight: 800; }
    .cart-popover .primary-btn {
      width: 100%;
      text-decoration: none;
      color: var(--on-primary) !important;
      background: var(--primary);
      display: block;
      text-align: center;
      padding: 12px 24px;
      border-radius: var(--radius-btn);
      font-weight: 700;
      font-size: 16px;
      pointer-events: auto;
      z-index: 10;
      position: relative;
    }
    .cart-popover .primary-btn.is-disabled { opacity: .45; pointer-events: none; }
    .cart-popover .cart-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .cart-popover .ghost-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px 24px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 14px;
      color: var(--brown);
      background: transparent;
      border: 1px solid var(--line);
      text-decoration: none;
      cursor: pointer;
      pointer-events: auto;
      z-index: 10;
      position: relative;
    }

    /* ── Configurator layout ───────────────────────────── */
    .cfg-body {
      padding: 74px 24px 20px;
      max-width: 1140px;
      margin: 0 auto;
    }
    .cfg-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 16px;
      color: var(--ink);
    }
    .cfg-grid {
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 420px);
      gap: 24px;
      align-items: start;
      justify-content: center;
      width: 100%;
      max-width: 100%;
    }

    /* Cake preview panel */
    .cfg-preview {
      position: relative;
      background-color: #c8bdb4;
      background-image: url("assets/configurator/cacke-bg/step1.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 420px;
      height: 420px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(98, 55, 24, .08);
      transition: background-image .45s ease;
    }
    .cfg-preview::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,248,245,.18) 0%, rgba(200,189,180,.28) 100%);
      pointer-events: none;
      z-index: 0;
    }
    .cfg-preview svg {
      position: relative;
      z-index: 1;
      width: 90%;
      height: auto;
    }

    /* Serving option cards */
    .cfg-options {
      display: flex;
      flex-direction: column;
      min-height: 420px;
      height: auto;
      max-height: 520px;
      justify-content: space-between;
      gap: 6px;
      overflow-y: auto;
      transition: opacity .35s ease;
    }
    .cfg-option.is-fly-out {
      transform: translateX(120%);
      opacity: 0;
      pointer-events: none;
      transition: transform .55s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity .45s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .cfg-option.is-fly-in {
      transform: translateX(120%);
      opacity: 0;
    }
    .cfg-option.is-fly-in-active {
      transform: translateX(0);
      opacity: 1;
      transition: transform .55s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity .45s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .cfg-option {
      display: grid;
      grid-template-columns: 52px 1fr;
      align-items: center;
      gap: 10px;
      padding: 3px;
      padding-right: 16px;
      min-height: 64px;
      border: 2px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(98, 55, 24, .08);
      background: #fff;
      cursor: pointer;
      overflow: hidden;
      text-align: left;
      font: inherit;
      color: inherit;
      width: 100%;
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    .cfg-option:hover {
      border-color: var(--outline);
      box-shadow: var(--shadow-soft);
    }
    .cfg-option.is-selected {
      border-color: var(--secondary-container);
      background: rgba(255, 216, 124, .18);
      box-shadow: var(--shadow-soft);
    }
    .cfg-option-icon {
      width: 48px;
      height: 48px;
      margin-left: 2px;
      overflow: hidden;
      border-radius: 8px;
      position: relative;
      flex-shrink: 0;
    }
    .cfg-option-icon > * {
      transition: transform .55s cubic-bezier(0.23, 1, 0.32, 1), opacity .45s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .cfg-option-icon > *.icon-exit-left {
      transform: translateX(-110%);
      opacity: 0;
    }
    .cfg-option-icon > *.icon-exit-right {
      transform: translateX(110%);
      opacity: 0;
    }
    .cfg-option-icon > *.icon-enter-from-left {
      transform: translateX(-110%);
      opacity: 0;
    }
    .cfg-option-icon > *.icon-enter-from-right {
      transform: translateX(110%);
      opacity: 0;
    }
    .cfg-option-icon > *.icon-enter-active {
      transform: translateX(0);
      opacity: 1;
    }
    .cfg-option-num {
      font-size: 24px;
      font-weight: 700;
      color: var(--brown);
      text-align: center;
      line-height: 1;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-sizing: border-box;
    }
    .cfg-option.is-selected .cfg-option-num {
      border-color: var(--brown);
    }
    .cfg-option-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: contain;
      border: 2px solid var(--line);
      background: #fff;
      padding: 3px;
      box-sizing: border-box;
      display: block;
    }
    .cfg-option[data-flavor="strawberry"] .cfg-option-thumb {
      background: rgba(232, 70, 112, .28);
    }
    .cfg-option[data-flavor="vanilla"] .cfg-option-thumb {
      background: rgba(232, 196, 120, .4);
    }
    .cfg-option[data-flavor="mango"] .cfg-option-thumb {
      background: rgba(245, 140, 40, .3);
    }
    .cfg-option[data-flavor="raspberry"] .cfg-option-thumb {
      background: rgba(194, 24, 91, .28);
    }
    .cfg-option[data-flavor="lemon"] .cfg-option-thumb {
      background: rgba(249, 220, 60, .4);
    }
    .cfg-option[data-flavor="chocolate"] .cfg-option-thumb {
      background: rgba(93, 58, 26, .28);
    }
    .cfg-option[data-cream="strawberry"] .cfg-option-thumb {
      background: rgba(232, 70, 112, .28);
    }
    .cfg-option[data-cream="vanilla"] .cfg-option-thumb {
      background: rgba(245, 230, 200, .45);
    }
    .cfg-option[data-cream="butter"] .cfg-option-thumb {
      background: rgba(255, 248, 230, .7);
    }
    .cfg-option[data-cream="raspberry"] .cfg-option-thumb {
      background: rgba(194, 24, 91, .28);
    }
    .cfg-option[data-cream="lemon"] .cfg-option-thumb {
      background: rgba(249, 220, 60, .4);
    }
    .cfg-option[data-cream="chocolate"] .cfg-option-thumb {
      background: rgba(93, 58, 26, .28);
    }
    .cfg-option[data-deco="sugar-sticks"] .cfg-option-thumb,
    .cfg-option[data-deco="mm"] .cfg-option-thumb,
    .cfg-option[data-deco="chocolate-drip"] .cfg-option-thumb,
    .cfg-option[data-deco="candles"] .cfg-option-thumb {
      background: rgba(255, 248, 245, .9);
    }
    .cfg-option[data-deco="text"] .cfg-option-glyph {
      font-size: 22px;
      font-weight: 700;
      color: var(--brown);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-sizing: border-box;
      font-family: "Libre Caslon Text", Georgia, serif;
    }
    .cfg-option.is-selected .cfg-option-thumb,
    .cfg-option.is-selected .cfg-option-glyph {
      border-color: var(--brown);
    }
    .cfg-option-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      width: 100%;
    }
    .cfg-option-body:has([data-extras="candles"]) {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .cfg-option-label-slot {
      position: relative;
      display: block;
      overflow: hidden;
      height: 1.4em;
      width: 100%;
      min-width: 0;
      text-align: left;
    }
    .cfg-option-body:has([data-extras="candles"]) .cfg-option-label-slot {
      width: auto;
      flex: 0 1 auto;
    }
    .cfg-deco-extras {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .cfg-deco-extras[data-extras="candles"] {
      margin-left: auto;
      flex-shrink: 0;
      justify-content: flex-end;
    }
    .cfg-option[data-deco="text"].is-selected {
      height: 98px;
      min-height: 98px;
      grid-template-rows: 48px auto;
      align-items: center;
      align-content: center;
      gap: 6px 10px;
      padding-top: 6px;
      padding-bottom: 8px;
    }
    .cfg-option[data-deco="text"].is-selected .cfg-deco-extras[data-extras="text"] {
      grid-column: 1 / -1;
      width: 100%;
      padding-left: 2px;
    }
    .cfg-option[data-deco="text"].is-selected .cfg-message-input {
      width: 100%;
    }
    .cfg-candle-count {
      width: 56px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      background: #fff;
    }
    .cfg-candle-modes {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .cfg-candle-mode {
      border: none;
      background: #fff;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .cfg-candle-mode:focus-visible {
      outline: 2px solid var(--secondary-container);
      outline-offset: -2px;
    }
    .cfg-candle-mode.is-active {
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }
    .cfg-message-input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: #fff;
    }
    .cfg-message-input.is-invalid {
      border-color: #c62828;
    }
    .cfg-message-error {
      font-size: 11px;
      color: #c62828;
      line-height: 1.2;
    }
    .cfg-step-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 420px;
      width: 420px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
      padding: 24px;
      background: rgba(255,255,255,.55);
    }
    .cfg-option-label {
      display: block;
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.4;
      white-space: nowrap;
      text-align: left;
      transition: transform 1.125s cubic-bezier(0.19, 1, 0.22, 1);
    }
    .cfg-option-label.label-exit-up {
      transform: translateY(-1.75rem);
    }
    .cfg-option-label.label-enter-from-below {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      transform: translateY(1.75rem);
      text-align: left;
    }
    .cfg-option-label.label-enter-active {
      transform: translateY(0);
    }

    /* Bottom bar: summary + progress + CTA */
    .cfg-bottom {
      margin-top: 16px;
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 420px);
      gap: 24px;
      align-items: end;
      justify-content: center;
      width: 100%;
      max-width: 100%;
    }
    .cfg-body.is-summary .cfg-grid {
      grid-template-columns: minmax(0, 420px);
      gap: 0;
    }
    .cfg-body.is-summary .cfg-options {
      display: none;
    }
    .cfg-body.is-summary .cfg-bottom {
      grid-template-columns: minmax(0, 420px);
      align-items: stretch;
      gap: 16px;
    }
    .cfg-body.is-summary .cfg-summary {
      align-items: flex-start;
    }
    .cfg-body.is-summary .cfg-summary-price {
      transform: none;
      align-self: flex-start;
      margin-top: 0;
    }
    .cfg-body.is-summary .cfg-summary-breakdown {
      transform: none;
      align-self: flex-end;
      margin-top: auto;
    }
    .cfg-body.is-summary .cfg-summary.is-deco-expanded {
      align-items: stretch;
    }
    .cfg-body.is-summary .cfg-right-col {
      width: 100%;
    }
    .cfg-summary {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: rgba(255, 216, 124, .22);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(98, 55, 24, .08);
      transition: min-height .2s ease;
      min-width: 0;
      width: 100%;

      { id: "chocolate-drip", modifier: 600, thumb: "chocolate.png" },

    const TOTAL_STEPS = 5;
    const DEFAULT_SIZE_IDX = 1;
    const DEFAULT_FLAVOR_IDX = 0;
    const DEFAULT_CREAM_IDX = 0;
    const MESSAGE_MAX_LINES = 3;
    const MESSAGE_MAX_LINE_LEN = 22;
    const MESSAGE_MAX_CHARS = MESSAGE_MAX_LINES * MESSAGE_MAX_LINE_LEN;
    const CAKE_TEXT_MAX_LINES = 2;
    // Target on-screen size; SVG slot grows on small previews so text stays readable
    const CAKE_TEXT_TARGET_CSS_W = 150;
    const CAKE_TEXT_TARGET_CSS_H = 45;
    const CAKE_TEXT_SLOT_W_MAX = 210;
    const CAKE_TEXT_SLOT_H_MAX = 60;
    const CAKE_TEXT_PAD_X = 6; // keep glyphs inside clip (serif overhang)

    const cakeConfig = {
